*{box-sizing:border-box;margin:0}button,input,select{font:inherit}
body{font-family:-apple-system,"Pretendard","Noto Sans KR",sans-serif;background:#ead3dc;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#191919}
#ph{width:390px;height:844px;background:#FCE8EF;border-radius:54px;border:10px solid #111;position:relative;overflow:hidden;box-shadow:0 30px 60px #0004;display:flex;flex-direction:column}
#isl{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:32px;background:#111;border-radius:20px;z-index:50}
#sb{height:52px;padding:16px 30px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:700;flex:none}
#sc{flex:1;overflow-y:auto;padding:6px 20px 24px}
#nv{flex:none;display:flex;background:#fff;padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid #f0d5de}
#nv button{flex:1;border:0;background:none;color:#a59aa0;font-size:11px;font-weight:600;padding:4px}
#nv button i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}#nv .on{color:#E31053}
@media(max-width:500px){body{background:#FCE8EF}#ph{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none;padding-top:env(safe-area-inset-top,0)}#isl,#sb{display:none}}
.card{background:#fff;border-radius:20px;padding:18px;margin-bottom:12px}
.btn{border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;background:#C94D73;color:#fff;width:100%;margin-top:8px}.btn.g{background:#f6dde6;color:#C94D73}.btn.s{padding:10px 14px;width:auto;font-size:14px;margin:0}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.4}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.li{padding:11px 0;border-bottom:1px solid #f4e8ec}.li:last-child{border:0}
.sub{color:#8b8b95;font-size:13px;margin-top:2px}.big{font-size:32px;font-weight:800;margin:6px 0 14px}h2{font-size:22px;margin:10px 0 14px}h3{font-size:16px;margin:6px 0 10px}
.hd{display:flex;align-items:center;gap:8px;margin:2px 0 8px}.hd button{border:0;background:none;font-size:28px;color:#C94D73}.hd b{font-size:18px}
input,select{width:100%;border:1.5px solid #f0d5de;border-radius:12px;padding:13px;font-size:16px;margin:4px 0 10px;background:#fff}input:focus,select:focus{outline:0;border-color:#C94D73}
label{font-size:13px;color:#6d6269;font-weight:600}.pl{color:#E31053}.tag{font-size:12px;padding:3px 8px;border-radius:8px;background:#f6dde6;color:#C94D73;font-weight:700}
.g3{display:flex;gap:8px}.g3 .btn{margin:0;padding:12px 4px;font-size:14px}.pg{height:8px;background:#f4e8ec;border-radius:6px;overflow:hidden;margin:8px 0}.pg i{display:block;height:100%;background:#C94D73}
.seg{display:flex;background:#f6dde6;border-radius:12px;padding:3px;margin-bottom:12px}.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-weight:700;color:#8b6b78}.seg .on{background:#fff;color:#C94D73}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;font-size:12px}.gr div{padding:6px 0}.gr i{display:flex;width:46px;height:46px;margin:0 auto 4px;border-radius:16px;background:#fff;color:#E31053;font-style:normal;font-size:20px;align-items:center;justify-content:center}
.pick{border:1.5px solid #f0d5de;border-radius:14px;padding:12px;margin-bottom:8px;background:#fff}.pick.on{border-color:#C94D73;background:#fdf1f5}
#md{display:none;position:absolute;inset:0;z-index:60}.bd{position:absolute;inset:0;background:#0006}.sh{position:absolute;left:0;right:0;bottom:0;max-height:85%;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:22px 20px 30px;animation:u .22s}
@keyframes u{from{transform:translateY(40px);opacity:0}}#ts{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:#191919e0;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;z-index:70;pointer-events:none;white-space:nowrap}
canvas{width:100%;height:230px;background:#fff;border:2px dashed #C94D73;border-radius:16px;touch-action:none;display:block}.note{background:#fff4d6;border-radius:12px;padding:10px 12px;font-size:12.5px;color:#7a5b00;margin:8px 0}.dot{width:8px;height:8px;border-radius:4px;background:#E31053;display:inline-block}.emp{text-align:center;color:#a59aa0;padding:22px 0;font-size:14px}

A.itForm=()=>M(`<h3>물건 등록</h3><label>물건 이름</label><input id="in" maxlength="30"><label>구분</label><select id="id"><option value="lend">내가 빌려줬어요</option><option value="borrow">내가 빌렸어요</option></select><label>상대방</label><select id="iw">${S.friends.map(f=>`<option>${esc(f.name)}</option>`).join('')}</select><label>대여 날짜</label><input id="is" type="date" value="${td()}"><label>반납 예정일</label><input id="ie" type="date" value="${ad(td(),7)}"><button class="btn" onclick="A.itSave()">등록</button><button class="btn g" onclick="M()">취소</button>`);
A.itSave=()=>{const n=$('#in').value.trim(),w=$('#iw').value,s=$('#is').value,e=$('#ie').value;if(!n)return T('물건 이름을 입력해요');if(!w)return T('친구를 먼저 추가해요');if(!s||!e||e<s)return T('날짜를 확인해요');
if(S.items.some(i=>i.st==='진행중'&&i.name===n&&i.who===w&&i.date===s))return T('이미 등록된 물건이에요');
S.items.unshift({id:uid(),name:n,dir:$('#id').value,who:w,date:s,due:e,st:'진행중'});note(`물건 등록: ${n} (${w})`);M();IT='진행중';T('등록됐어요');R(1)};
A.ret=id=>{const i=S.items.find(x=>x.id===id);i.st='완료';i.ret=td();note(`물건 반납 완료: ${i.name}`);T('반납 완료 처리했어요');R(1)};
/* MORE / FRIENDS / NOTI / SUBS / PRIVACY */
V.more=()=>`<h2>전체</h2><div class="card" onclick="go('pv')"><div class="row"><div class="row">${logo(44)}<div><b>${esc(S.user.name)}</b><div class="sub">@${esc(S.user.id)}</div></div></div>›</div></div><div class="card">${[['fr','👥 친구 관리'],['ns','🔔 알림'+(myN().some(n=>!n.r)?' ●':'')],['subs','🔁 계정·구독 관리'],['pv','⚙ 개인정보·설정'],['sw','🔄 상대방 화면으로 보기 (시연)']].map(([k,n])=>`<div class="row li" onclick="go('${k}')"><span>${n}</span>›</div>`).join('')}</div>`;
V.fr=()=>hd('친구')+`<div class="card"><label>KEEPIN ID</label><input id="fi" placeholder="영문·숫자·_ 3~20자"><label>이름</label><input id="fn" maxlength="20"><button class="btn" onclick="A.frAdd()">친구 추가</button></div><div class="card">${S.friends.length?S.friends.map(f=>`<div class="row li"><div><b>${esc(f.name)}</b><div class="sub">@${esc(f.id)}</div></div><button class="btn s g" onclick="A.frDel('${f.id}')">삭제</button></div>`).join(''):emp('친구가 없어요')}</div><div class="sub">시연용 데이터예요. 실제 사용자 검색·서버 연결은 없어요.</div>`;
A.frAdd=()=>{const i=$('#fi').value.trim(),n=$('#fn').value.trim();if(!/^[A-Za-z0-9_]{3,20}$/.test(i))return T('ID 형식을 확인해요');if(!n)return T('이름을 입력해요');if(i===S.user.id)return T('내 ID는 추가할 수 없어요');if(S.friends.some(f=>f.id.toLowerCase()===i.toLowerCase()))return T('이미 추가된 ID예요');S.friends.push({id:i,name:n});S.fb[i]=300000;note(`친구 연결: ${n}`);T('친구를 추가했어요');R()};
A.frDel=id=>{if(S.cs.some(c=>!['상환 완료','계약 거절','계약 취소','지급 기한 만료'].includes(c.st)&&c.partner.id===id))return T('진행 중인 계약이 있어 삭제할 수 없어요');S.friends=S.friends.filter(f=>f.id!==id);R(1)};
V.ns=()=>hd('알림')+`<button class="btn g" style="margin:0 0 12px" onclick="myN().forEach(n=>n.r=1);R(1)">모두 읽음 처리</button>${myN().length?myN().map(n=>`<div class="card" onclick="A.read('${n.id}')"><div class="row"><span>${n.r?'':'<span class="dot"></span> '}${esc(n.m)}</span></div><div class="sub">${n.t.slice(0,16).replace('T',' ')}</div></div>`).join(''):emp('알림이 없어요')}`;
A.read=id=>{const n=S.ns.find(x=>x.id===id);n.r=1;n.cid&&S.cs.some(c=>c.id===n.cid)?A.open(n.cid):R(1)};
V.subs=()=>hd('계정·구독')+`<button class="btn" style="margin:0 0 12px" onclick="A.subForm()">추가</button>${S.subs.length?S.subs.map(s=>`<div class="card"><div class="row"><b>${esc(s.svc)}</b><span class="tag">${s.sub?'구독 · ':''}${dl(s.date)}</span></div><div class="sub">${esc(s.alias)} · ${esc(s.kind)} · 갱신 ${s.date}</div>${s.memo?`<div class="sub">${esc(s.memo)}</div>`:''}<div class="g3" style="margin-top:8px"><button class="btn s g" onclick="A.subForm('${s.id}')">수정</button><button class="btn s g" onclick="A.subDel('${s.id}')">삭제</button></div></div>`).join(''):emp('등록된 계정이 없어요')}<div class="sub">비밀번호·인증번호는 저장하지 않아요.</div>`;
A.subForm=id=>{const s=S.subs.find(x=>x.id===id)||{svc:'',alias:'',kind:'기타',sub:true,date:ad(td(),30),memo:''};M(`<h3>${id?'수정':'계정 추가'}</h3><label>서비스 이름</label><input id="ss" maxlength="30" value="${esc(s.svc)}"><label>계정 별칭</label><input id="sa" maxlength="30" value="${esc(s.alias)}"><label>종류</label><select id="sk">${['영상','음악','클라우드','쇼핑','기타'].map(k=>`<option ${s.kind===k?'selected':''}>${k}</option>`).join('')}</select><label>구독 여부</label><select id="sy"><option value="1" ${s.sub?'selected':''}>구독 중</option><option value="" ${s.sub?'':'selected'}>구독 아님</option></select><label>결제/갱신 예정일</label><input id="sd" type="date" value="${s.date}"><label>메모</label><input id="sm" maxlength="50" value="${esc(s.memo)}"><div class="note">비밀번호는 입력하지 마세요.</div><button class="btn" onclick="A.subSave('${id||''}')">저장</button><button class="btn g" onclick="M()">취소</button>`)};
A.subSave=id=>{const o={svc:$('#ss').value.trim(),alias:$('#sa').value.trim(),kind:$('#sk').value,sub:!!$('#sy').value,date:$('#sd').value,memo:$('#sm').value.trim()};if(!o.svc)return T('서비스 이름을 입력해요');if(!o.date)return T('갱신일을 입력해요');
if(id)Object.assign(S.subs.find(x=>x.id===id),o);else S.subs.push({id:uid(),...o});M();T('저장했어요');R(1)};
A.subDel=id=>{S.subs=S.subs.filter(s=>s.id!==id);R(1)};
V.pv=()=>hd('개인정보·설정')+`<div class="card"><h3>프로필</h3><label>이름(별칭)</label><input id="pn" maxlength="20" value="${esc(S.user.name)}"><label>KEEPIN ID</label><input id="pi" maxlength="20" value="${esc(S.user.id)}"><label>비밀번호 (숫자 6자리)</label><input id="pp" type="password" inputmode="numeric" maxlength="6" value="${S.user.pin||'123456'}"><button class="btn" onclick="A.pSave()">저장</button></div><div class="card"><h3>개인정보 보호 안내</h3><div class="sub" style="line-height:1.6">계약 절차에서 이름·주민번호·전화번호·주소를 입력받지만, 주민번호는 뒷자리 첫 자리만 남기고 전화번호·주소는 일부만 가려 저장해요. 은행 계좌번호는 받지 않아요. 현재 모든 데이터는 이 브라우저의 로컬 저장소에만 저장되고 서버로 전송되지 않아요. 이 앱은 시연용이며 실제 금융 거래·법적 효력이 있는 계약·본인 인증은 제공하지 않아요.</div></div><div class="card"><h3>가상 충전</h3><div class="sub" style="margin-bottom:8px">KEEPIN 계좌는 자산 보관용이에요. 다른 앱 결제·현장 결제에는 사용할 수 없어요.</div><button class="btn g" onclick="A.money('in')">가상 충전하기</button></div><div class="card"><h3>시연 데이터 관리</h3><button class="btn g" onclick="A.reset(1)">시연 데이터로 초기화</button><button class="btn g" onclick="A.reset(0)">모든 데이터 삭제</button></div>`;
A.pSave=()=>{const n=$('#pn').value.trim(),i=$('#pi').value.trim();if(!n)return T('이름을 입력해요');if(!/^[A-Za-z0-9_]{3,20}$/.test(i))return T('ID는 영문·숫자·_ 3~20자예요');const pp=$('#pp').value;if(!/^\d{6}$/.test(pp))return T('비밀번호는 숫자 6자리예요');S.user={name:n,id:i,pin:pp};T('저장했어요');R(1)};
A.reset=d=>M(`<h3>정말 초기화할까요?</h3><div class="sub">계약·거래·물건·알림이 모두 지워져요.</div><button class="btn" onclick="A.doReset(${d})">초기화</button><button class="btn g" onclick="M()">취소</button>`);
A.doReset=d=>{S=seed();if(!d){S.friends=[];S.subs=[];S.bal=0;S.ns=[]}M();stk=[];tab='home';T('초기화했어요');R()};

/* SUPABASE INTEGRATION: real auth, server balance, real virtual-account transfer */
window.KEEPIN_BRIDGE={
  getState:()=>S,
  setState:(v)=>{const base=seed();S={...base,...v};S.user={...base.user,...(v?.user||{})};S.friends=Array.isArray(v?.friends)?v.friends:[];S.items=Array.isArray(v?.items)?v.items:[];S.subs=Array.isArray(v?.subs)?v.subs:[];S.ns=Array.isArray(v?.ns)?v.ns:[];S.cs=[];S.fb={};S.ptx={};S.bal=0;S.tx=[];save();R()},
  setAccount:(account)=>{S.accountNumber=account?.account_number||'';S.bal=Number(account?.balance||0);S.tx=account?.transactions||[];R()},
  setProfile:(p)=>{S.user={name:p?.display_name||'키핀 사용자',id:p?.keepin_id||'KEEPIN'};R()},
  refresh:()=>R()
};
A.sendMenu=()=>M(`<h3>무엇을 할까요?</h3><button class="btn" onclick="A.startSend()">① 가상 계좌로 송금<div style="font-weight:400;font-size:12px">실제 사용자 계좌로 가상 잔액을 보내요</div></button><button class="btn g" onclick="T('돈 빌려주기·빌리기는 서버 동기화 기능을 준비 중이에요')">② 돈 빌려주기 · 준비 중</button><button class="btn g" onclick="T('돈 빌리기는 서버 동기화 기능을 준비 중이에요')">돈 빌리기 · 준비 중</button>`);
A.startSend=()=>{M();D={role:'send',step:0,receiverAccount:'',receiverName:'',amt:'',memo:''};go('send')};
V.send=()=>{const h=hd('가상 계좌 송금','A.sb()');
 if(D.step===0)return h+`<label>받는 사람의 KEEPIN 계좌번호</label><div class="row"><input id="ac" autocomplete="off" placeholder="KEEP으로 시작하는 계좌번호" style="margin:0;text-transform:uppercase"><button class="btn s" onclick="A.find()">조회</button></div>${D.receiverName?`<div class="card" style="margin-top:12px"><div class="sub">받는 사람</div><b>${esc(D.receiverName)}</b><div class="sub">${esc(D.receiverAccount)}</div></div>`:''}<div class="note">상대방이 회원가입을 완료해야 송금할 수 있어요. 샘플 친구나 임의 계좌로는 송금되지 않아요.</div><button class="btn" onclick="A.p0()">다음</button>`;
 if(D.step===1)return h+amtUI('보낼 가상 금액을 입력하세요');
 if(D.step===2)return h+`<div class="card"><div class="sub">받는 사람</div><b>${esc(D.receiverName)}</b><div class="sub">${esc(D.receiverAccount)}</div><div class="big">${won(+D.amt)}</div><div class="row li"><span>송금 후 잔액</span><b>${won(S.bal-Number(D.amt))}</b></div></div><label>메모 (선택)</label><input maxlength="40" value="${esc(D.memo)}" oninput="D.memo=this.value" placeholder="송금 메모"><div class="note">KEEPIN 내부에서만 이동하는 가상 잔액입니다. 실제 돈이나 은행 계좌와 연결되지 않습니다.</div><button class="btn" onclick="A.sGo()">가상 송금 확정</button>`;
 return h+`<div class="card"><h3>송금 완료</h3><b>${esc(D.receiverName)}님에게 ${won(+D.amt)}을 보냈어요.</b></div><button class="btn" onclick="A.tab('acct')">계좌 보기</button>`};
A.find=async()=>{const v=$('#ac')?.value?.trim();if(!v)return T('계좌번호를 입력해 주세요');try{const r=await window.KEEPIN_BACKEND.lookupAccount(v);D.receiverAccount=r.account_number;D.receiverName=r.display_name;R(1)}catch(e){T(e.message||'계좌를 찾을 수 없어요')}};
A.p0=()=>{if(!D.receiverAccount)return T('먼저 계좌를 조회해 주세요');D.step=1;R()};
A.sGo=async()=>{const amount=Number(D.amt);if(!Number.isSafeInteger(amount)||amount<=0)return T('송금 금액을 확인해 주세요');if(amount>S.bal)return T('가상 잔액이 부족해요');try{await window.KEEPIN_BACKEND.transfer(D.receiverAccount,amount,D.memo||'가상 송금');D.step=3;await window.KEEPIN_BACKEND.refreshAccount();T('가상 송금이 완료됐어요');R()}catch(e){T(e.message||'송금에 실패했어요')}};
V.more=()=>`<h2>전체</h2><div class="card"><div class="row">${logo(44)}<div><b>${esc(S.user.name)}</b><div class="sub">${esc(window.KEEPIN_BACKEND?.email||'')}</div></div></div></div><div class="card">${[['fr','👥 친구 관리'],['ns','🔔 알림'],['subs','🔁 계정·구독 관리'],['pv','⚙ 개인정보·설정']].map(([k,n])=>`<div class="row li" onclick="go('${k}')"><span>${n}</span>›</div>`).join('')}</div>`;
A.money=()=>T('가상 잔액 충전·출금은 제공하지 않아요. 가입 시 지급된 가상 잔액만 사용할 수 있어요.');
A.doMoney=()=>T('가상 잔액 충전·출금은 제공하지 않아요.');
A.startFlow=()=>T('돈 빌려주기·빌리기는 양측 동의와 서버 동기화가 완성되기 전까지 사용할 수 없어요.');
A.repay=()=>T('상환 기능은 서버 동기화가 완성되기 전까지 사용할 수 없어요.');
V.acct=()=>`<h2>계좌</h2><div class="card"><div class="sub">내 KEEPIN 가상 계좌번호</div><b style="font-size:17px;letter-spacing:.5px">${esc(S.accountNumber||'계좌 불러오는 중')}</b><button class="btn g s" style="margin-top:10px" onclick="navigator.clipboard?.writeText('${esc(S.accountNumber||'')}').then(()=>T('계좌번호를 복사했어요'))">계좌번호 복사</button><div class="divider"></div><div class="sub">사용 가능 가상 잔액</div><div class="big">${won(S.bal)}</div><div class="note">실제 은행 계좌가 아닌 KEEPIN 내부 가상 계좌입니다. 실제 송금·결제·출금은 불가능합니다.</div><button class="btn" onclick="A.sendMenu()">가상 송금하기</button></div><div class="card"><h3>거래 내역</h3>${S.tx.length?S.tx.map(txRow).join(''):emp('아직 거래 내역이 없어요')}</div>`;
V.pv=()=>hd('개인정보·설정')+`<div class="card"><h3>로그인 계정</h3><div class="sub">${esc(window.KEEPIN_BACKEND?.email||'')}</div><div class="sub">이름과 KEEPIN ID는 가입 정보로 관리돼요.</div></div><div class="card"><h3>가상 계좌 안내</h3><div class="sub" style="line-height:1.7">KEEPIN 잔액은 앱 내부에서만 사용하는 가상 금액입니다. 실제 금융기관·현금·결제 수단과 연결되지 않습니다. 비밀번호는 Supabase 인증으로 관리하며 이 앱은 비밀번호나 주민등록번호를 별도로 저장하지 않습니다.</div></div><div class="card"><button class="btn g" onclick="window.KEEPIN_BACKEND.signOut()">로그아웃</button></div>`;

/* INIT */
(function(){S.hold=S.hold||0;S.fb=S.fb||{};S.ptx=S.ptx||{};S.role=S.role||'me';S.friends.forEach(f=>{if(S.fb[f.id]==null)S.fb[f.id]=300000});S.cs.forEach(c=>{if(c.st==='진행중')c.st='상환 진행 중';if(c.st==='완료')c.st='상환 완료';c.log=c.log||[];c.agreed=c.agreed||{me:true,partner:true};if(c.v2&&c.held&&c.exp<td())A.close(c,'지급 기한 만료','기한 내에 수령하지 않아 지급 대기 금액이 반환됐어요')});let ch=0;S.cs.filter(c=>c.st==='상환 진행 중').forEach(c=>{const n=nextDue(c);if(n&&dd(n.d)<=3&&c.nt!==n.d){c.nt=n.d;note(`상환 예정일 임박: ${c.title} (${n.d})`);ch=1}});
S.items.filter(i=>i.st==='진행중'&&dd(i.due)<=3&&i.nt!==i.due).forEach(i=>{i.nt=i.due;note(`물건 반납 예정일 임박: ${i.name} (${i.due})`)});
const ck=()=>{$('#clk').textContent=new Date().toTimeString().slice(0,5)};ck();setInterval(ck,3e4);R();splash()})();
</script>
<style>
#keepin-auth{position:fixed;inset:0;z-index:99999;background:#FCE8EF;display:flex;align-items:center;justify-content:center;padding:22px;font-family:inherit;color:#242126}

</style>
<div id="keepin-auth"><div class="auth-card"><h1>KEEPIN</h1><div class="muted" id="auth-sub">나만의 가상 계좌로 간편하게 관리해요.</div><form id="auth-form"><label for="auth-name" id="auth-name-label" hidden>이름 또는 별칭</label><input id="auth-name" autocomplete="nickname" placeholder="이름 또는 별칭" hidden><label for="auth-email">이메일</label><input id="auth-email" type="email" autocomplete="email" required placeholder="이메일 주소"><label for="auth-password">비밀번호</label><input id="auth-password" type="password" autocomplete="current-password" minlength="8" required placeholder="8자 이상"><button class="primary" id="auth-submit" type="submit">로그인</button></form><button class="switch" id="auth-switch" type="button">처음이신가요? 회원가입</button><div class="msg" id="auth-msg" role="status"></div><div class="fine">KEEPIN은 실제 은행이 아닙니다. 계좌와 잔액은 앱 안에서만 사용하는 가상 정보이며 실제 송금·결제·출금은 지원하지 않습니다. 주민등록번호 등 민감한 개인정보는 입력하지 마세요.</div></div></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL='https://ktfblxdgajogdvqrpzof.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_22-bLYdCiitpGf3th1ynUA_eRkiDhpB';
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $id=id=>document.getElementById(id), auth=$id('keepin-auth');let mode='login',currentUser=null;
const showMessage=(s,ok=false)=>{const n=$id('auth-msg');n.textContent=s;n.style.color=ok?'#24734a':'#B32650'};
function renderMode(){const signup=mode==='signup';$id('auth-name').hidden=!signup;$id('auth-name-label').hidden=!signup;$id('auth-name').required=signup;$id('auth-password').autocomplete=signup?'new-password':'current-password';$id('auth-submit').textContent=signup?'회원가입':'로그인';$id('auth-switch').textContent=signup?'이미 계정이 있나요? 로그인':'처음이신가요? 회원가입';$id('auth-sub').textContent=signup?'이메일로 계정을 만들고 가상 계좌를 발급받아요.':'가입한 계정으로 로그인해 주세요.';showMessage('')}
$id('auth-switch').addEventListener('click',()=>{mode=mode==='login'?'signup':'login';renderMode()});
$id('auth-form').addEventListener('submit',async e=>{e.preventDefault();const email=$id('auth-email').value.trim(),password=$id('auth-password').value,name=$id('auth-name').value.trim();$id('auth-submit').disabled=true;showMessage('처리 중…',true);try{if(mode==='signup'){if(!name)throw Error('이름 또는 별칭을 입력해 주세요.');const {data,error}=await supabase.auth.signUp({email,password,options:{data:{display_name:name},emailRedirectTo:location.origin+location.pathname}});if(error)throw error;if(!data.session){showMessage('가입 확인 메일을 보냈습니다. 이메일의 인증 링크를 누른 뒤 다시 로그인해 주세요.',true);return}}else{const {error}=await supabase.auth.signInWithPassword({email,password});if(error)throw error} }catch(err){showMessage(err.message||'인증에 실패했습니다.')}finally{$id('auth-submit').disabled=false}});
const backend={get email(){return currentUser?.email||''},async saveState(state){if(!currentUser)return;const safe={friends:state.friends||[],items:state.items||[],subs:state.subs||[],ns:state.ns||[],hold:0,cs:[]};const {error}=await supabase.from('user_app_data').upsert({user_id:currentUser.id,app_state:safe,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)console.warn('앱 데이터 저장 실패',error.message)},async lookupAccount(account){const {data,error}=await supabase.rpc('keepin_lookup_account',{p_account:account});if(error)throw error;if(!data?.length)throw Error('해당 KEEPIN 계좌를 찾을 수 없습니다.');return data[0]},async transfer(receiver,amount,memo){const {error}=await supabase.rpc('keepin_transfer',{p_receiver_account:receiver,p_amount:amount,p_memo:memo,p_request_id:crypto.randomUUID()});if(error)throw error},async refreshAccount(){if(!currentUser)return;const [{data:account,error:ae},{data:tx,error:te}]=await Promise.all([supabase.from('accounts').select('account_number,balance').eq('user_id',currentUser.id).single(),supabase.from('transactions').select('id,sender_id,receiver_id,amount,memo,kind,created_at').or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`).order('created_at',{ascending:false}).limit(100)]);if(ae)throw ae;if(te)throw te;const rows=(tx||[]).map(t=>({id:t.id,t:t.created_at,a:t.receiver_id===currentUser.id?Number(t.amount):-Number(t.amount),who:t.kind==='initial_credit'?'KEEPIN':(t.receiver_id===currentUser.id?'가상 송금 받음':'가상 송금 보냄'),memo:t.memo,type:t.kind==='initial_credit'?'in':'transfer'}));window.KEEPIN_BRIDGE?.setAccount({...account,transactions:rows})},async load(){const {data,error}=await supabase.from('user_app_data').select('app_state').eq('user_id',currentUser.id).maybeSingle();if(error)throw error;const state=data?.app_state||{};const base=window.KEEPIN_BRIDGE.getState();window.KEEPIN_BRIDGE.setState({...base,...state,user:{name:currentUser.user_metadata?.display_name||'키핀 사용자',id:'KEEPIN'}});const {data:profile}=await supabase.from('profiles').select('display_name,keepin_id').eq('id',currentUser.id).single();if(profile)window.KEEPIN_BRIDGE.setProfile(profile);await this.refreshAccount()},async signOut(){await supabase.auth.signOut();location.reload()}};
window.KEEPIN_BACKEND=backend;
async function enter(user){currentUser=user;try{await backend.load();auth.style.display='none';const lk=$id('lk');if(lk)lk.style.display='none';window.KEEPIN_BRIDGE.refresh()}catch(e){showMessage('계정 정보를 불러오지 못했습니다: '+(e.message||''));}}
supabase.auth.onAuthStateChange((event,session)=>{if(session?.user)queueMicrotask(()=>enter(session.user));else{currentUser=null;auth.style.display='flex'}});
const {data:{session}}=await supabase.auth.getSession();if(session?.user)await enter(session.user);else{auth.style.display='flex';const lk=$id('lk');if(lk)lk.style.display='none'}
</script>
